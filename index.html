sifica o efeito estufa?"], "resp": ["Seis.", "O gás carbônico (CO<sub>2</sub>)."], "links": ["<a href=\"https://www.youtube.com/results?search_query=biomas+brasileiros\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: biomas brasileiros</a>", "<a href=\"https://www.youtube.com/results?search_query=climas+do+Brasil+e+fatores+clim%C3%A1ticos\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: climas do Brasil e fatores climáticos</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}, {"id": "geo3", "mat": "Geografia", "n": 3, "titulo": "População, urbanização e globalização", "calma": "Aqui o foco é <b>pessoas e lugares</b>: por que as cidades cresceram tão rápido, o que isso causa e como o mundo ficou conectado. Muita questão usa gráfico ou tabela, então treine a leitura de dados.", "passos": ["Leia título, eixos e fonte do gráfico.", "Ligue o dado a uma causa (êxodo rural, industrialização).", "Pense nas consequências (moradia, trânsito, desigualdade)."], "formulas": "IDH mede renda, saúde e educação. Êxodo rural: migração do campo para a cidade. Globalização: integração de economias e culturas.", "exemplo": "A industrialização no Sudeste atraiu migrantes e fez a população urbana crescer.", "ex": ["O que o IDH mede?", "O que é êxodo rural?"], "resp": ["Renda, saúde (expectativa de vida) e educação.", "A migração de pessoas do campo para a cidade."], "links": ["<a href=\"https://www.youtube.com/results?search_query=urbaniza%C3%A7%C3%A3o+brasileira\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: urbanização brasileira</a>", "<a href=\"https://www.youtube.com/results?search_query=globaliza%C3%A7%C3%A3o+resumo+geografia\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: globalização resumo geografia</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}, {"id": "soc1", "mat": "Sociologia", "n": 1, "titulo": "Os clássicos da Sociologia", "calma": "A Sociologia estuda <b>como vivemos em sociedade</b>. Os três autores principais olham para ela de jeitos diferentes: Durkheim vê regras que existem acima de nós (fatos sociais), Weber foca no sentido que as pessoas dão às suas ações e Marx enxerga a luta entre classes pelo controle do trabalho e da riqueza.", "passos": ["Ligue cada autor a seu conceito.", "Pense num exemplo do dia a dia para cada conceito."], "formulas": "Durkheim: fato social (normas e costumes). Weber: ação social. Marx: classes sociais e luta de classes.", "exemplo": "Seguir uma regra de trânsito, mesmo sem ninguém olhando, é um exemplo de <b>fato social</b>.", "ex": ["Quem formulou o conceito de fato social?", "A que Marx dá mais importância para explicar a sociedade?"], "resp": ["Durkheim.", "Às classes sociais e à relação entre trabalho e capital."], "links": ["<a href=\"https://www.youtube.com/results?search_query=Durkheim+Weber+e+Marx+resumo+sociologia\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: Durkheim Weber e Marx resumo sociologia</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}, {"id": "soc2", "mat": "Sociologia", "n": 2, "titulo": "Cultura, desigualdade e cidadania", "calma": "Cada grupo tem sua cultura, e nenhuma é “melhor” só por ser a nossa. Julgar os outros pelo nosso jeito se chama <b>etnocentrismo</b>; entender cada cultura a partir dela mesma é <b>relativismo cultural</b>. Cidadania é ter direitos e deveres na prática.", "passos": ["Diferencie etnocentrismo e relativismo cultural.", "Ligue desigualdade a acesso a direitos.", "Classifique os direitos: civis, políticos e sociais."], "formulas": "Direitos civis: liberdade e igualdade perante a lei. Políticos: votar e ser votado. Sociais: saúde, educação, trabalho.", "exemplo": "Achar que a comida de outro país é “estranha” porque é diferente da sua é um sinal de etnocentrismo.", "ex": ["O que é etnocentrismo?", "Dê um exemplo de direito social."], "resp": ["Julgar outras culturas tendo a sua própria como padrão.", "Saúde, educação ou moradia."], "links": ["<a href=\"https://www.youtube.com/results?search_query=etnocentrismo+e+relativismo+cultural\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: etnocentrismo e relativismo cultural</a>", "<a href=\"https://www.youtube.com/results?search_query=cidadania+direitos+civis+pol%C3%ADticos+e+sociais\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: cidadania direitos civis políticos e sociais</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}, {"id": "fil1", "mat": "Filosofia", "n": 1, "titulo": "Filosofia antiga", "calma": "A Filosofia começa quando alguém pergunta “<b>por quê?</b>” em vez de aceitar tudo pronto. Na Grécia antiga, Sócrates ensinava fazendo perguntas, Platão dizia que o mundo que vemos é uma sombra do mundo das ideias e Aristóteles estudava a lógica e a ética.", "passos": ["Associe cada filósofo à sua ideia central.", "Entenda a alegoria da caverna: quem sai da caverna descobre a realidade."], "formulas": "Sócrates: maiêutica. Platão: mundo das ideias e alegoria da caverna. Aristóteles: lógica e virtude como equilíbrio.", "exemplo": "Na alegoria da caverna, as sombras na parede representam as aparências que tomamos como verdade.", "ex": ["O que é a maiêutica?", "Que alegoria de Platão fala de sombras na parede?"], "resp": ["O método de Sócrates: fazer perguntas para a pessoa descobrir a verdade sozinha.", "A alegoria da caverna."], "links": ["<a href=\"https://www.youtube.com/results?search_query=S%C3%B3crates+Plat%C3%A3o+e+Arist%C3%B3teles+resumo\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: Sócrates Platão e Aristóteles resumo</a>", "<a href=\"https://www.youtube.com/results?search_query=alegoria+da+caverna+explicada\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: alegoria da caverna explicada</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}, {"id": "fil2", "mat": "Filosofia", "n": 2, "titulo": "Ética e política moderna", "calma": "Ética é pensar sobre o que é <b>certo e errado</b> e por quê. Na política, vários filósofos perguntaram por que existe o Estado: Hobbes disse que abrimos mão de liberdade por segurança, Locke defendeu direitos naturais e Rousseau falou em vontade geral.", "passos": ["Ligue cada filósofo a uma ideia.", "Compare as visões de Estado e poder."], "formulas": "Kant: agir por dever. Hobbes: contrato social por segurança. Locke: vida, liberdade e propriedade. Rousseau: vontade geral.", "exemplo": "Quando todos respeitam as regras da sala para a convivência funcionar, há um pequeno <b>contrato social</b>.", "ex": ["Quem defendeu o contrato social para garantir segurança?", "O que a ética estuda?"], "resp": ["Hobbes.", "Os princípios do agir moral, o que é certo e errado."], "links": ["<a href=\"https://www.youtube.com/results?search_query=contrato+social+Hobbes+Locke+Rousseau\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: contrato social Hobbes Locke Rousseau</a>", "<a href=\"https://www.youtube.com/results?search_query=%C3%A9tica+filosofia+conceitos\" target=\"_blank\" rel=\"noopener\">Videoaulas no YouTube: ética filosofia conceitos</a>", "<a href=\"https://brasilescola.uol.com.br/\" target=\"_blank\" rel=\"noopener\">Brasil Escola</a>"]}], "plano": [["1", "Matemática 1, 2 e 3 (porcentagem, 1º e 2º grau) + <b>Biologia:</b> como estudar e célula", "Física 1 (cinemática)"], ["2", "Matemática 4 e 5 (geometria plana e espacial) + <b>Biologia:</b> DNA, RNA e proteínas", "Química 1 (misturas)"], ["3", "Física 2 e 3 (Newton, energia) + <b>Biologia:</b> mitose e meiose", "Matemática 6 (estatística)"], ["4", "Química 2, 3 e 4 (átomo, ligações, ácidos e bases) + <b>Biologia:</b> genética", "Física 4 (termologia)"], ["5", "Matemática 7, 8 e 9 (probabilidade, PA/PG, trigonometria) + <b>Biologia:</b> evolução e ecologia", "Física 5 (ondas)"], ["6", "Física 6 e 7 + Química 5, 6 e 7 + <b>Biologia:</b> corpo humano e vírus", "Química 8 (orgânica)"], ["7", "Simulado com provas antigas (Vunesp/Fuvest) e cronômetro", "<b>Biologia:</b> fotossíntese, ambiente e revisão dos erros; dormir cedo!"]], "cores": {"Matemática": "#D81B60", "Física": "#8E2A6B", "Química": "#FF6FA8"}, "ic": {"Matemática": "📐", "Física": "⚡", "Química": "🧪"}};

const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let feito=load("feito",{}),plano=load("plano",{}),serie=load("serie","3");
const provas={"3":"2026-11-04","2":"2026-11-10","1":"2026-11-12"};
const T=Object.fromEntries(D.t.map(t=>[t.id,t])),mats=["Matemática","Física","Química","Biologia","Português","Inglês","História","Geografia","Sociologia","Filosofia"];
const COR={"Matemática":"#FF7DB5","Física":"#B79CFF","Química":"#FFA98A","Biologia":"#5CD6B3","Português":"#F2A33A","Inglês":"#6EC1FF","História":"#C98B5E","Geografia":"#8BD450","Sociologia":"#FF8FD8","Filosofia":"#8F9BFF"},EM={"Matemática":"📐","Física":"⚡","Química":"🧪","Biologia":"🧬","Português":"📖","Inglês":"🌎","História":"🏛️","Geografia":"🗺️","Sociologia":"👥","Filosofia":"💭"},CL={"Matemática":"","Física":"lav","Química":"pea"};
const pct=m=>{const l=D.t.filter(t=>!m||t.mat===m);return Math.round(100*l.filter(t=>feito[t.id]).length/l.length)};
const dias=()=>Math.ceil((new Date(provas[serie]+"T08:00:00")-new Date())/864e5);
const prox=()=>D.t.find(t=>!feito[t.id]);
const NAV=[["#/","🏠","Início"],["#/plano","📅","Plano"],["#/materias","📚","Matérias"],["#/foco","⏱️","Foco"]];
const nav=r=>$("#nav").innerHTML=NAV.map(([h,i,n])=>`<a href="${h}" class="${r===h?"on":""}"><i>${i}</i>${n}</a>`).join("");
const MASC=`<svg class="mascote" viewBox="0 0 120 110" aria-hidden="true"><path d="M60 100C20 72 6 50 6 32 6 16 18 8 31 8c12 0 22 7 29 18C67 15 77 8 89 8c13 0 25 8 25 24 0 18-14 40-54 68z" fill="#FF7DB5" stroke="#E5388A" stroke-width="4"/><ellipse cx="42" cy="48" rx="6" ry="8" fill="#5A1239"/><ellipse cx="78" cy="48" rx="6" ry="8" fill="#5A1239"/><circle cx="44" cy="45" r="2.3" fill="#fff"/><circle cx="80" cy="45" r="2.3" fill="#fff"/><ellipse cx="32" cy="62" rx="8" ry="5" fill="#FFB3D3"/><ellipse cx="88" cy="62" rx="8" ry="5" fill="#FFB3D3"/><path d="M52 62q8 9 16 0" fill="none" stroke="#5A1239" stroke-width="3.5" stroke-linecap="round"/><path d="M96 6l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FFD84D"/></svg>`;
const views={
home(){const d=dias(),p=prox();
 const msg=d>1?`Faltam <b>${d} dias</b> para a sua prova! ✨`:d===1?"A prova é <b>amanhã</b>! Revise com carinho e durma bem 🌙":d===0?"<b>A prova é hoje!</b> Você se preparou, respira fundo 💪":"Sua prova já passou. Parabéns pelo esforço! 🎉";
 return `<div style="text-align:center">${MASC}<h1>Oi, Estella! 💗</h1><p class="lead">Aqui você aprende <b>todas as matérias</b> da prova <b>de pouquinho em pouquinho</b>, sem sofrimento. Bora?</p></div>
 <div class="card tape"><h3>🎀 Sua prova</h3><label for="sr">Em qual série você está?</label><select id="sr"><option value="3">3º ano (prova em 4 e 5 de novembro)</option><option value="2">2º ano (10 e 11 de novembro)</option><option value="1">1º ano (12 e 13 de novembro)</option></select><p>${msg}</p></div>
 <div class="card lav"><h3>🌈 Seu progresso</h3>${mats.map(m=>`<div class="pl"><span>${EM[m]} ${m}</span><span>${pct(m)}%</span></div><div class="bar"><i style="width:${pct(m)}%;background:${COR[m]}"></i></div>`).join("")}</div>
 ${p?`<a class="btn" href="#/t/${p.id}">▶ Continuar: ${p.titulo}</a>`:`<div class="card min"><b>Você marcou todos os tópicos! 🏆</b> Agora é refazer os exercícios que errou.</div>`}
 <a class="btn alt" href="#/plano">📅 Ver o plano de 7 dias</a><a class="btn alt" href="guia.pdf" target="_blank" rel="noopener">📄 Abrir o PDF do guia</a>
 <div class="card pea"><h3>🧁 Como estudar cada tópico</h3><ol class="p"><li><span>Leia “Em outras palavras” para entender a ideia.</span></li><li><span>Siga o passo a passo com papel e lápis.</span></li><li><span>Refaça o exemplo sem olhar.</span></li><li><span>Tente os exercícios antes de ver a resposta.</span></li><li><span>Marque como estudado e comemore! 🎉</span></li></ol></div>`},
plano(){return `<h1>📅 Plano de 7 dias</h1><p class="lead">De 2 a 3 horas por dia, em blocos de 25 minutos com pausa. Se um dia falhar, sem culpa: continue de onde parou 💗</p>`+
 D.plano.map(([n,f,r])=>`<label class="card dia"><input type="checkbox" data-d="${n}" ${plano[n]?"checked":""}><span><b>Dia ${n}</b><br>${f}<br><small>Extra: ${r}</small></span></label>`).join("")+
 `<div class="card lav"><h3>⏰ Rotina de cada sessão</h3><ol class="p"><li><span><b>10 min</b> lendo o passo a passo</span></li><li><span><b>10 min</b> refazendo o exemplo sem olhar</span></li><li><span><b>25 min</b> em exercícios e provas antigas</span></li><li><span><b>5 min</b> anotando o que errou e por quê</span></li></ol></div>
 <div class="card pea"><h3>🧬 Biologia todo dia</h3><p>A Biologia agora está em <b>todos os dias</b> do plano, com uns 30 a 40 minutos por dia, porque é onde você mais quer evoluir. Português e Inglês entram por 20 minutos nos dias mais leves.</p></div><div class="card min"><h3>🍓 Cuide de você</h3><p>Durma bem, beba água e faça lanches leves. No dia da prova leve documento com foto e caneta preta de tubo transparente, e chegue antes das 7h45.</p></div>`},
materias(){return `<h1>📚 Matérias</h1><p class="lead">Comece pelo que parece mais fácil, para ganhar confiança!</p>`+
 mats.map(m=>`<h3 style="margin-top:22px">${EM[m]} ${m} <small>(${pct(m)}% feito)</small></h3>`+D.t.filter(t=>t.mat===m).map(t=>`<a class="item" href="#/t/${t.id}"><span class="e" style="background:${COR[m]}">${t.n}</span><div>${t.titulo}<small>${feito[t.id]?"Estudado 🎉":"Ainda não estudado"}</small></div><span class="chk ${feito[t.id]?"on":""}">${feito[t.id]?"✓":""}</span></a>`).join("")).join("")},
foco(){return `<h1>⏱️ Modo foco</h1><p class="lead">Estude 25 minutos sem distração e descanse 5. O cérebro guarda muito melhor assim!</p>
 <div class="card"><div class="ring"><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="104" fill="none" stroke="#FFD3E6" stroke-width="14"/><circle id="arc" cx="115" cy="115" r="104" fill="none" stroke="#E5388A" stroke-width="14" stroke-linecap="round" stroke-dasharray="653.5"/></svg><b id="tm">25:00</b></div>
 <div class="row"><button class="btn" id="ini">▶ Começar</button><button class="btn alt" id="pau">⏸ Pausar</button></div>
 <div class="row"><button class="btn alt" data-m="25">Foco 25</button><button class="btn alt" data-m="5">Pausa 5</button><button class="btn alt" data-m="15">Pausa 15</button></div></div>`},
t(id){const t=T[id];if(!t)return views.materias();const i=D.t.indexOf(t),pr=D.t[i-1],nx=D.t[i+1],c=COR[t.mat];
 return `<a href="#/materias">← Voltar às matérias</a><div style="margin-top:12px"><span class="tag" style="background:${c}">${EM[t.mat]} ${t.mat} ${t.n}</span></div><h1>${t.titulo}</h1>
 <div class="card tape"><h3>💬 Em outras palavras</h3><div class="nota">${t.calma}</div></div>
 <div class="card lav"><h3>🪜 Passo a passo</h3><ol class="p">${t.passos.map(p=>`<li><span>${p}</span></li>`).join("")}</ol></div>
 <div class="card"><h3>📌 Fórmulas e ideias-chave</h3><div class="fm">${t.formulas}</div><p class="mu">Copie no caderno com as suas palavras. Escrever ajuda a lembrar! ✏️</p></div>
 <div class="card min"><h3>🌟 Exemplo de aplicação</h3><p>${t.exemplo}</p><p class="mu">Cubra a resposta e refaça sozinha antes de seguir.</p></div>
 <div class="card pea"><h3>✏️ Exercícios</h3><p class="mu">Pegue papel e lápis e só depois abra a resposta.</p>${t.ex.map((e,k)=>`<p><b>${"abc"[k]})</b> ${e}</p><details><summary>👀 Ver resposta</summary><div class="rs">${t.resp[k]}</div></details>`).join("")}</div>
 <div class="card"><h3>🎥 Onde estudar</h3><ul style="padding-left:20px;margin:0">${t.links.map(l=>`<li style="margin:6px 0">${l}</li>`).join("")}</ul></div>
 <button class="btn ${feito[t.id]?"ok":""}" id="fz">${feito[t.id]?"✅ Estudado (toque para desmarcar)":"✨ Marcar como estudado"}</button>
 <div class="row">${pr?`<a class="btn alt" href="#/t/${pr.id}">← Anterior</a>`:""}${nx?`<a class="btn alt" href="#/t/${nx.id}">Próximo →</a>`:""}</div>`}
};
function confete(x,y){const E=["💗","✨","🌸","⭐","💖"];for(let i=0;i<14;i++){const s=document.createElement("span");s.className="fx";s.textContent=E[i%5];s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--dx",(Math.random()*240-120)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
let iv=null,tot=1500,rest=1500,rodando=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function bind(h){
 const sr=$("#sr");if(sr){sr.value=serie;sr.onchange=()=>{serie=sr.value;save("serie",serie);rota()}}
 document.querySelectorAll("[data-d]").forEach(e=>e.onchange=()=>{plano[e.dataset.d]=e.checked;save("plano",plano);if(e.checked){const r=e.getBoundingClientRect();confete(r.left,r.top)}});
 const fz=$("#fz");if(fz)fz.onclick=()=>{const id=h.split("/")[2],r=fz.getBoundingClientRect();feito[id]=!feito[id];save("feito",feito);rota();if(feito[id])confete(innerWidth/2,innerHeight-120)};
 const tm=$("#tm");if(tm){const draw=()=>{tm.textContent=fmt(rest);$("#arc").style.strokeDashoffset=653.5*(1-rest/tot)};draw();
  const tick=()=>{if(!rodando)return;rest--;draw();if(rest<=0){rodando=false;clearInterval(iv);if(navigator.vibrate)navigator.vibrate([300,100,300]);alert("Tempo! Hora de descansar (ou voltar ao foco) 💗")}};
  $("#ini").onclick=()=>{if(!rodando&&rest>0){rodando=true;clearInterval(iv);iv=setInterval(tick,1000)}};
  $("#pau").onclick=()=>{rodando=false;clearInterval(iv)};
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{rodando=false;clearInterval(iv);tot=rest=b.dataset.m*60;draw()})}}
function rota(){const h=location.hash||"#/",p=h.split("/"),r="#/"+(p[1]||""),v=p[1]||"home";
 $("#app").innerHTML=(views[v]||views.home)(p[2]);nav(p[1]==="t"?"#/materias":r);bind(h);window.scrollTo(0,0)}
addEventListener("hashchange",rota);rota();
</script>
</body>
</html>
